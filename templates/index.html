{% extends "layout.html" %}

{% block content %}
<section class="app-layout">
    <section class="left-box">
        <div id="home-view">
            <h3>Chat History</h3>
            <button onclick="startNewChat()" class="new-chat-btn" id="ui-new-chat">
                <i class="fa-solid fa-plus"></i> New Question
            </button>
            <div id="left-box">
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
        <div id="profile-view" style="display: none;">
            <h3>Profile</h3>
            <div class="theme-settings">
                <h3>Dr. Lewis' Verbosity</h3>
                <select id="verbosity-select" class="glass-select">
                    <option value="not at all">Silent</option>
                    <option value="less">Concise</option>
                    <option value="medium" selected>Standard</option>
                    <option value="a lot">Detailed</option>
                </select>
            </div>
            <div class="theme-settings">
                <h3>Theme Customization</h3>
                <div class="color-picker-group">
                    <div class="picker-item">
                        <input type="color" id="color1" value="#b8b8ff">
                        <span>Primary</span>
                    </div>
                    <div class="picker-item">
                        <input type="color" id="color2" value="#f8f7ff">
                        <span>Accent</span>
                    </div>
                    <div class="picker-item">
                        <input type="color" id="color3" value="#ffd8be">
                        <span>Primary</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab" role="tablist">
            <div class="tab-segment home tab-segment--active" tabindex="0">Home</div>
            <div class="tab-segment profile" tabindex="0">Profile</div>
        </div>
    </section>

    <section class="chat" aria-label="Chemistry chat">
        <h3>Dr. Lewis</h3>
        <div id="chat" class="messages"></div>
        <div class="chat-footer">
            <input id="message-input" class="chat-input" type="text" placeholder="Type your question here...">
            <button type="button" id="sendQuestion" class="send">Send</button>
        </div>
    </section>
</section>
{% endblock %}
